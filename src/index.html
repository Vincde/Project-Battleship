<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <nav>
        <a href="./index.html" class="logo">
            <img src="./img/cruise.png" alt="image logo">
            <span>BattleShip game</span>
        </a>
    </nav>
    <main>

        <section class="boards">
            <div class="player-1-board">
                <button type="button" class="player-1-board__bttn">Show/hide</button>
                <button type="button" class="player-1-randomize__ship">Randomize</button>
                <button type="button" class="player-1-randomize__place">Place</button>
                <div class="player-1-board__ships"></div>
                <div class="player-1-board__shots"></div>
            </div>
            <div class="player-2-board">
                <button type="button" class="player-2-board__bttn">Show/hide</button>
                <button type="button" class="player-2-randomize__ship">Randomize</button>
                <button type="button" class="player-2-randomize__place">Place</button>
                <div class="player-2-board__ships"></div>
                <div class="player-2-board__shots"></div>
            </div>
        </section>

        <aside class="score">
            <button class="start-game" type="button">Start Game!</button>
            <h1 class="player-1-score"> 
                Player 1 : <span></span>
            </h1>
            
            <br>
            <h1 class="player-2-score">
                Player 2 : <span></span> 
            </h1>
            
        </aside>
    </main>
</body>
</html>
